<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabriek – Verduurzaming</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Grafische weergave van een fabriek</h1>
        <p>
          Klik op <strong>CCUS</strong> of <strong>Elektrificatie</strong> om de
          onderdelen te highlighten. Deze pagina is geschikt om te embedden in
          een iframe.
        </p>
      </header>

      <section class="factory" aria-label="Interactieve fabrieksweergave">
        <svg
          class="factory-svg"
          viewBox="0 0 960 520"
          role="img"
          aria-labelledby="factory-title factory-desc"
        >
          <title id="factory-title">Duurzame fabriek met klikbare onderdelen</title>
          <desc id="factory-desc">
            Een gestileerde fabriek met een CCUS-installatie en een
            elektrificatiezone die aanklikbaar zijn.
          </desc>

          <defs>
            <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#dff2ff" />
              <stop offset="100%" stop-color="#f6fbff" />
            </linearGradient>
            <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#dde7df" />
              <stop offset="100%" stop-color="#c8d8cc" />
            </linearGradient>
          </defs>

          <rect width="960" height="360" fill="url(#sky)" />
          <rect y="360" width="960" height="160" fill="url(#ground)" />

          <g class="smokestack" transform="translate(110 90)">
            <rect width="80" height="210" fill="#8a8f98" />
            <rect x="10" y="20" width="60" height="190" fill="#b0b6bf" />
            <ellipse cx="40" cy="0" rx="50" ry="18" fill="#cfd5dd" />
            <ellipse cx="70" cy="-30" rx="30" ry="12" fill="#dce1e8" />
            <ellipse cx="30" cy="-50" rx="40" ry="14" fill="#e4e9ef" />
          </g>

          <rect x="220" y="180" width="520" height="180" rx="12" fill="#4e5968" />
          <rect x="250" y="210" width="460" height="130" rx="8" fill="#6b778b" />
          <rect x="250" y="170" width="120" height="40" rx="6" fill="#3c4654" />
          <rect x="390" y="170" width="120" height="40" rx="6" fill="#3c4654" />
          <rect x="530" y="170" width="120" height="40" rx="6" fill="#3c4654" />

          <g class="windows">
            <rect x="280" y="240" width="60" height="40" rx="6" />
            <rect x="360" y="240" width="60" height="40" rx="6" />
            <rect x="440" y="240" width="60" height="40" rx="6" />
            <rect x="520" y="240" width="60" height="40" rx="6" />
            <rect x="600" y="240" width="60" height="40" rx="6" />
          </g>

          <g class="pipeline">
            <rect x="170" y="320" width="140" height="30" rx="14" fill="#9ab0c8" />
            <rect x="310" y="320" width="140" height="30" rx="14" fill="#9ab0c8" />
            <rect x="450" y="320" width="140" height="30" rx="14" fill="#9ab0c8" />
            <rect x="590" y="320" width="140" height="30" rx="14" fill="#9ab0c8" />
          </g>

          <a class="hotspot" href="#ccus" data-feature="ccus">
            <g class="feature feature-ccus">
              <rect x="620" y="110" width="240" height="150" rx="14" />
              <rect x="650" y="140" width="180" height="90" rx="10" />
              <circle cx="700" cy="185" r="22" />
              <rect x="730" y="170" width="90" height="30" rx="15" />
              <text x="740" y="130">CCUS</text>
            </g>
          </a>

          <a class="hotspot" href="#elektrificatie" data-feature="elektrificatie">
            <g class="feature feature-elektrificatie">
              <rect x="80" y="300" width="200" height="130" rx="14" />
              <rect x="110" y="330" width="140" height="70" rx="10" />
              <path d="M170 320 l20 -30 l-10 0 l20 -35 l-40 45 l15 0 z" />
              <text x="105" y="315">Elektrificatie</text>
            </g>
          </a>
        </svg>

        <div class="info" role="status" aria-live="polite">
          <h2>Details</h2>
          <p id="feature-text">
            Klik op een onderdeel in de fabriek om een korte toelichting te
            bekijken.
          </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
